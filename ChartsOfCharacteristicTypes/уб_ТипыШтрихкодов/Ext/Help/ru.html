<h1>Типы штрихкодов</h1>
<p>В списке типов штрихкодов хранятся все типы штрихкодов, используемых в программе. Эта информация используется при формировании штрихкодов в справочнике <a href="Catalog.Номенклатура/Help">"Номенклатура"</a> и печати этикеток штрихкодов , а также при считывании штрихкодов с помощью сканера штрихкодов.</p></body></html>
